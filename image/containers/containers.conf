# Nested podman in bree-base (image/Containerfile).
# Nested containers share the outer container's namespaces (so they reach the
# network without pasta); there is no systemd or cgroup delegation in here.
# Copied from quay.io/podman/stable.
[containers]
netns="host"
userns="host"
ipcns="host"
utsns="host"
cgroupns="host"
cgroups="disabled"
log_driver = "k8s-file"
# A nested rootless container cannot mount a fresh /proc under the outer
# container's masked paths, so bind the outer one. (quay.io/podman/stable
# keeps these two in the user's containers.conf; the image has no home.)
volumes = [
	"/proc:/proc",
]
default_sysctls = []

[engine]
cgroup_manager = "cgroupfs"
events_logger="file"
runtime="crun"
