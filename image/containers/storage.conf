# Nested podman in bree-base (image/Containerfile).
# Native rootless overlay: kernel overlayfs in a user namespace (5.11+, 5.13+ with
# SELinux). The rootless graphroot stays the default under the home
# (~/.local/share/containers/storage), where bree mounts the profile's storage
# volume: it must be on a volume, not on the container's own overlay root.
[storage]
driver = "overlay"

[storage.options.overlay]
mountopt = "nodev"
